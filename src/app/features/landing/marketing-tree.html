        <ellipse cx="30" cy="54" rx="19" ry="13" fill="#7f9a63" transform="rotate(13 30 54)" />

      </g>
      <path d="M43 73Q53 63 61 71Q52 81 43 73Z" fill="#4e7d4a" opacity=".82" />
      <g transform="translate(111 49)">
        @for (angle of [0, 72, 144, 216, 288]; track angle) {
          <ellipse
            rx="3.5"
            ry="7"
            cy="-5"
            fill="#e5a8c0"
            stroke="#cf87a6"
            stroke-width=".7"
            [attr.transform]="'rotate(' + angle + ')'"
          />
        }
        <circle r="3" fill="#a8935a" />
      </g>
      <circle cx="28" cy="57" r="5" fill="#fdfbf3" stroke="#a8935a" stroke-width="2.4" />
      <circle cx="28" cy="57" r="1.7" fill="#a8935a" />
    </svg>
  }
  @case ('demo') {
    <svg class="art demo-tree" viewBox="0 0 520 420" aria-hidden="true" focusable="false">
      <ellipse cx="260" cy="375" rx="160" ry="18" fill="#9db98a" opacity=".28" />
      <g [attr.transform]="model.transform">
        @for (flare of model.flare; track $index) {
          <path [attr.d]="flare" fill="#6f5640" />
        }
        @for (trunk of model.trunks; track $index) {
          <path [attr.d]="trunk" fill="#6f5640" />
        }
        @for (limb of model.limbs; track limb.id) {
          <path [attr.d]="limb.d" [style.fill]="limb.fill" />
        }
        @for (pad of model.pads; track $index) {
          <ellipse
            class="canopy-pad"
            [attr.cx]="pad.x"
            [attr.cy]="pad.y"
            [attr.rx]="pad.rx"
            [attr.ry]="pad.ry"
            [attr.transform]="'rotate(' + pad.rot + ' ' + pad.x + ' ' + pad.y + ')'"
            [attr.data-shade]="pad.shade"
          />
        }
        @for (leaf of model.leaves; track $index) {
          @if (leaf.kind === 'leaf') {
            <path
              class="leaf"
              [attr.transform]="
                'translate(' + leaf.x + ' ' + leaf.y + ') rotate(' + leaf.angle + ')'
              "
              [attr.d]="
                'M 0 0 Q ' +
                leaf.size +
                ' ' +
                -leaf.size +
                ' 0 ' +
                -2 * leaf.size +
                ' Q ' +
                -leaf.size +
                ' ' +
                -leaf.size +
                ' 0 0 Z'
              "
              [attr.data-shade]="leaf.shade"
            />
          }
        }
        @for (bud of model.buds; track bud.id) {
          <path
            class="bud"
            [attr.transform]="'translate(' + bud.x + ' ' + bud.y + ')'"
            d="M0 3C-5-2-4-10 0-14C5-9 5-2 0 3Z"
          />
        }
        @for (knot of model.knots; track knot.id) {
          <g [attr.transform]="'translate(' + knot.x + ' ' + knot.y + ')'">
            <circle r="7" class="knot-ring" />
            <circle r="2.4" class="knot-core" />
          </g>
        }
        @for (bloom of model.blooms; track bloom.id) {
          <g [attr.transform]="'translate(' + bloom.x + ' ' + bloom.y + ')'">
            <g appFlower [flower]="model.flower" [scale]="0.68" />
          </g>
        }
      </g>
    </svg>
  }
  @default {

            cy="-11"
            fill="#e5a8c0"

          />

        <circle r="6" fill="#a8935a" />

    </svg>
  }
