name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate deployment configuration contracts
        run: npm run test:config

      - name: Run application tests
        run: npm test -- --watch=false

      - name: Build the root-hosted PWA
        run: npm run build -- --base-href /

      - name: Validate the built PWA
        run: node tools/validate-built-pwa.mjs --build-dir dist/roadmap2u/browser

      - name: Keep AWS adapters out of the initial bundle
        shell: bash
        run: |
          set -euo pipefail
          if grep -E -i 'cognito-idp|amazonaws[.]com|aws-amplify|Cognito' dist/roadmap2u/browser/main-*.js; then
            echo 'AWS provider signature leaked into the initial bundle.' >&2
            exit 1
          fi

      - name: Install the locked Playwright Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Check public routes and two-device recovery in the browser
        env:
          RM_BROWSER_CHANNEL: chromium
        run: |
          node tools/verify-public-shell.mjs
          node tools/probe-two-device-recovery.mjs

      - name: Build the isolated public catalog fixture
        run: npm run build -- --configuration production,ci-public-catalog --base-href / --output-path dist/public-catalog-ci

      - name: Check delayed and unavailable catalogs in the browser
        env:
          RM_BROWSER_CHANNEL: chromium
        run: node tools/probe-public-catalog.mjs
