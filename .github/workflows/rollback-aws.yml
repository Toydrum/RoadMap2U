name: Roll back frontend on AWS
run-name: Roll back ${{ inputs.stage }} to ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Environment to roll back
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
      release_sha:
        description: Exact lowercase SHA already successful in this environment
        required: true
        type: string
      recovery_mode:
        description: Rebuild compatible source or restore the retained validated artifact
        required: true
        default: rebuild
        type: choice
        options:
          - rebuild
          - snapshot

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-aws-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  rollback:
    if: ${{ vars.AWS_DEPLOY_ENABLED == 'false' && vars.AWS_ROLLBACK_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.stage }}
      url: ${{ steps.ssm.outputs.frontend_url }}
    env:
      STAGE: ${{ inputs.stage }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      RECOVERY_MODE: ${{ inputs.recovery_mode }}
    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: roadmap2u-frontend-rollback-${{ inputs.stage }}-${{ github.run_id }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Validate the assumed AWS identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"

      - name: Validate the recovery mode
        shell: bash
        run: |
          case "$RECOVERY_MODE" in
            rebuild|snapshot) ;;
            *) echo 'Unsupported recovery mode.' >&2; exit 1 ;;
          esac

      - name: Require a successful release marker in this stage
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'release_sha must be an exact lowercase 40-character commit SHA.' >&2
            exit 1
          }
          marker="$(aws ssm get-parameter \
            --name "/roadmap2u/${STAGE}/frontend-releases/$RELEASE_SHA" \
            --query 'Parameter.Value' \
            --output text)"
          test "$marker" = "$RELEASE_SHA"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.recovery_mode == 'snapshot' && github.sha || inputs.release_sha }}
          fetch-depth: 0

      - name: Verify the exact source or recovery tool revision
        shell: bash
        env:
          CHECKOUT_SHA: ${{ inputs.recovery_mode == 'snapshot' && github.sha || inputs.release_sha }}
        run: test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm

      - name: Install locked dependencies
        if: ${{ inputs.recovery_mode == 'rebuild' }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Read the immutable backend release manifest
        id: ssm
        shell: bash
        run: bash tools/read-backend-release.sh

      - name: Summarize the verified release pair
        shell: bash
        env:
          BACKEND_RELEASE_SHA: ${{ steps.ssm.outputs.backend_release_sha }}
          CONTRACT_HASH: ${{ steps.ssm.outputs.contract_hash }}
        run: |
          {
            echo '### Verified release pair'
            echo "- Backend SHA: \`$BACKEND_RELEASE_SHA\`"
            echo "- Frontend SHA: \`$RELEASE_SHA\`"
            echo "- Contract hash: \`$CONTRACT_HASH\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate the rollback target and CloudFront binding
        shell: bash
        env:
          ROADMAP2U_STAGE: ${{ inputs.stage }}
          ROADMAP2U_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ROADMAP2U_FRONTEND_BUCKET: ${{ steps.ssm.outputs.frontend_bucket }}
          ROADMAP2U_DISTRIBUTION_ID: ${{ steps.ssm.outputs.distribution_id }}
          ROADMAP2U_FRONTEND_URL: ${{ steps.ssm.outputs.frontend_url }}
          ROADMAP2U_API_BASE_URL: ${{ steps.ssm.outputs.api_base_url }}
          ROADMAP2U_RELEASE_SHA: ${{ inputs.release_sha }}
          SITE_BUCKET: ${{ steps.ssm.outputs.frontend_bucket }}
          DISTRIBUTION_ID: ${{ steps.ssm.outputs.distribution_id }}
          FRONTEND_URL: ${{ steps.ssm.outputs.frontend_url }}
        run: |
          set -euo pipefail
          node tools/validate-deployment-target.mjs
          bash tools/validate-aws-binding.sh

      - name: Regenerate the target config
        if: ${{ inputs.recovery_mode == 'rebuild' }}
        env:
          ROADMAP2U_STAGE: ${{ inputs.stage }}
          ROADMAP2U_REGION: ${{ steps.ssm.outputs.region }}
          ROADMAP2U_USER_POOL_ID: ${{ steps.ssm.outputs.user_pool_id }}
          ROADMAP2U_USER_POOL_CLIENT_ID: ${{ steps.ssm.outputs.user_pool_client_id }}
          ROADMAP2U_API_BASE_URL: ${{ steps.ssm.outputs.api_base_url }}
          ROADMAP2U_CONTRACT_HASH: ${{ steps.ssm.outputs.contract_hash }}
        run: npm run generate:config

      - name: Test and rebuild the selected release
        if: ${{ inputs.recovery_mode == 'rebuild' }}
        run: |
          npm run test:config
          npm test -- --watch=false
          npm run build -- --base-href /

      - name: Download and verify the successful retained artifact
        if: ${{ inputs.recovery_mode == 'snapshot' }}
        env:
          SITE_BUCKET: ${{ steps.ssm.outputs.frontend_bucket }}
          API_BASE_URL: ${{ steps.ssm.outputs.api_base_url }}
          USER_POOL_ID: ${{ steps.ssm.outputs.user_pool_id }}
          USER_POOL_CLIENT_ID: ${{ steps.ssm.outputs.user_pool_client_id }}
        run: node tools/restore-aws-snapshot.mjs --output dist/roadmap2u/browser

      - name: Validate the rebuilt PWA
        run: node tools/validate-built-pwa.mjs --build-dir dist/roadmap2u/browser --recovery-mode "$RECOVERY_MODE"

      - name: Keep AWS adapters out of the initial bundle
        shell: bash
        run: |
          set -euo pipefail
          if grep -E -i 'cognito-idp|amazonaws[.]com|aws-amplify|Cognito' dist/roadmap2u/browser/main-*.js; then
            echo 'AWS provider signature leaked into the initial bundle.' >&2
            exit 1
          fi

      - name: Revalidate the backend pointer before publication
        shell: bash
        env:
          EXPECTED_BACKEND_RELEASE_SHA: ${{ steps.ssm.outputs.backend_release_sha }}
        run: |
          set -euo pipefail
          CURRENT_BACKEND_RELEASE_SHA="$(aws ssm get-parameter \
            --name "/roadmap2u/${STAGE}/backend-release-sha" \
            --query 'Parameter.Value' \
            --output text)"
          test "$CURRENT_BACKEND_RELEASE_SHA" = "$EXPECTED_BACKEND_RELEASE_SHA"

      - name: Republish assets and versioned mutable entrypoints
        shell: bash
        env:
          BUILD_DIR: dist/roadmap2u/browser
          SITE_BUCKET: ${{ steps.ssm.outputs.frontend_bucket }}
          DISTRIBUTION_ID: ${{ steps.ssm.outputs.distribution_id }}
        run: bash tools/publish-aws-site.sh

      - name: Smoke the restored host and API boundary
        shell: bash
        env:
          FRONTEND_URL: ${{ steps.ssm.outputs.frontend_url }}
          DISTRIBUTION_ID: ${{ steps.ssm.outputs.distribution_id }}
          API_BASE_URL: ${{ steps.ssm.outputs.api_base_url }}
        run: |
          set -euo pipefail
          SMOKE_FRONTEND_URL="$FRONTEND_URL"
          if [[ "$STAGE" == prod ]]; then
            distribution_domain="$(aws cloudfront get-distribution \
              --id "$DISTRIBUTION_ID" \
              --query 'Distribution.DomainName' \
              --output text)"
            SMOKE_FRONTEND_URL="https://$distribution_domain"
          fi
          node tools/smoke-frontend.mjs \
            --frontend-url "$SMOKE_FRONTEND_URL" \
            --api-base-url "$API_BASE_URL" \
            --cors-origin "$FRONTEND_URL" \
            --recovery-mode "$RECOVERY_MODE"

      - name: Point the stage at the restored release
        shell: bash
        run: |
          set -euo pipefail
          aws ssm put-parameter \
            --name "/roadmap2u/${STAGE}/frontend-release-sha" \
            --type String \
            --value "$RELEASE_SHA" \
            --overwrite
